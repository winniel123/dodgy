[package]
edition = "2021"
name = "dodgy_2d"
version = "0.5.5"

description = "An implementation of ORCA, a local collision avoidance algorithm for 2D."

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/andriyDev/dodgy"

categories = ["game-development"]
keywords = ["orca", "rvo", "collision", "avoidance", "navigation"]

[dependencies]
glam = "0.29.1"
# The trig goes through one implementation on every machine, not the platform's C runtime,
# which on Windows picks its algorithm by CPU.
libm = "0.2"

[features]
# Allows access to some of the internal data used to generate the final suggested velocity.
debug = []
